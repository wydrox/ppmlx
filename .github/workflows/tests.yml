name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.0"

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Check the lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Run Ruff
        run: uv run ruff check ppmlx tests scripts/*.py

      - name: Run Mypy
        run: uv run mypy ppmlx

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  package:
    name: Package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.0"

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Check the lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Build the distribution
        run: uv build --out-dir dist

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Check package contents
        id: package
        run: |
          uv run python scripts/check_distribution.py dist \
            --manifest "$RUNNER_TEMP/ppmlx-release.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create a clean virtual environment
        run: uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/ppmlx-package-venv"

      - name: Install the wheel in the clean environment
        env:
          BUILT_WHEEL: ${{ steps.package.outputs.wheel }}
        run: |
          uv pip install \
            --python "$RUNNER_TEMP/ppmlx-package-venv/bin/python" \
            "$BUILT_WHEEL"

      - name: Run the package smoke test
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          "$RUNNER_TEMP/ppmlx-package-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/verify_installed_distribution.py" \
            --expected-version "$EXPECTED_VERSION"
